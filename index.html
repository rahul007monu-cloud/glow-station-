<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0710" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Glow Station" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=yes" />

    <title>Glow Station Luxe Salon | Hair, Skin, Nails &amp; Bridal Studio</title>
    <meta
      name="description"
      content="Glow Station Luxe Salon - premium hair styling, colour, facials, nails, makeup and bridal packages. Book your slot on WhatsApp in 30 seconds."
    />
    <link rel="canonical" href="https://glowstationluxesalon.com/" />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glow Station Luxe Salon" />
    <meta property="og:title" content="Glow Station Luxe Salon | Look Luxe, Feel Luxe" />
    <meta
      property="og:description"
      content="Hair, skin, nails, makeup &amp; bridal studio. Instant WhatsApp booking, member pricing and first-visit offers."
    />
    <meta property="og:url" content="https://glowstationluxesalon.com/" />
    <meta property="og:image" content="/icons/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- <link rel="manifest"> is injected automatically by vite-plugin-pwa -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Local business structured data. Update together with src/data/salon.ts
      whenever the address, phone number or hours change.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "name": "Glow Station Luxe Salon",
        "image": "https://glowstationluxesalon.com/icons/og-cover.png",
        "url": "https://glowstationluxesalon.com/",
        "telephone": "+91-00000-00000",
        "priceRange": "₹₹",
        "currenciesAccepted": "INR",
        "paymentAccepted": "Cash, UPI, Card",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Shop address line",
          "addressLocality": "City",
          "addressRegion": "State",
          "postalCode": "000000",
          "addressCountry": "IN"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday"
            ],
            "opens": "10:00",
            "closes": "21:00"
          }
        ],
        "sameAs": ["https://www.instagram.com/glow_station_luxe_salon/"],
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Hair cut & styling" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Hair colour & highlights" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Keratin & smoothening" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Facials & skin care" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Nail extensions & art" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Bridal makeup packages" } }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: sans-serif; color: #fff; background: #0b0710">
        <h1>Glow Station Luxe Salon</h1>
        <p>Please enable JavaScript, or call us directly to book an appointment.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
