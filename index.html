<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0908" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Divine Touch" />
    <meta name="application-name" content="Divine Touch" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=yes" />

    <title>Divine Touch by Diksha Gupta | Beauty Services at Home – Makeup, Facials, Waxing</title>
    <meta
      name="description"
      content="Divine Touch by Diksha Gupta – eyebrows, waxing, manicure-pedicure, massages, hair styling, facials, body treatments, makeup and skin consultation at your home. 10% off your first service. Book on WhatsApp."
    />
    <!-- TODO: custom domain lene ke baad yahan aur og:url / og:image me update karo. -->
    <link rel="canonical" href="https://divinetouch-theta.vercel.app/" />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Divine Touch" />
    <meta property="og:title" content="Divine Touch by Diksha Gupta | Where Beauty Meets Perfection" />
    <meta
      property="og:description"
      content="Premium beauty services at your doorstep. Enhance. Elegance. Empower. 10% off your first service."
    />
    <meta property="og:url" content="https://divinetouch-theta.vercel.app/" />
    <meta property="og:image" content="https://divinetouch-theta.vercel.app/icons/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- <link rel="manifest"> is injected automatically by vite-plugin-pwa -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Local business structured data. Update together with src/data/salon.ts
      whenever the address, phone number or hours change.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HealthAndBeautyBusiness",
        "name": "Divine Touch",
        "alternateName": "Divine Touch by Diksha Gupta",
        "slogan": "Where Beauty Meets Perfection",
        "founder": { "@type": "Person", "name": "Diksha Gupta" },
        "image": "https://divinetouch-theta.vercel.app/icons/og-cover.png",
        "url": "https://divinetouch-theta.vercel.app/",
        "telephone": "+91-90570-03469",
        "priceRange": "₹₹",
        "currenciesAccepted": "INR",
        "paymentAccepted": "Cash, UPI",
        "areaServed": "Your City",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
            "opens": "09:00",
            "closes": "20:00"
          }
        ],
        "sameAs": ["https://www.instagram.com/divine_touch_/"],
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Eyebrow threading & shaping" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Waxing & hair removal" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Manicure & pedicure" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Massages" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Hair styling" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Facials" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Body treatments" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Party & bridal makeup" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Skin consultation" } }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: sans-serif; color: #fff; background: #0b0908">
        <h1>Divine Touch by Diksha Gupta</h1>
        <p>Please enable JavaScript, or WhatsApp / call +91 90570 03469 to book an appointment.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
